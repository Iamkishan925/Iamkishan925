[project]
name = "mk-pari"
version = "0.1.0"
description = "Pari - a multilingual, Claude-powered trading assistant (paper trading by default)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "httpx2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "yfinance>=0.2.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pari = "mk_pari.cli:main"

[tool.setuptools.packages.find]
include = ["mk_pari*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
