# Production-style stack: only Caddy publishes ports. Backend and Postgres stay on the
# internal network. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pari
      POSTGRES_USER: pari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pari -d pari"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PARI_ENV: production
      PARI_COOKIE_SECURE: "true"
      PARI_TRUST_PROXY: "true"
      PARI_DATA_KEY: ${PARI_DATA_KEY:?set PARI_DATA_KEY in .env}
      PARI_ALLOWED_ORIGINS: https://${PARI_DOMAIN:-localhost}
      DATABASE_URL: postgresql+psycopg://pari:${POSTGRES_PASSWORD}@db:5432/pari

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      PARI_DOMAIN: ${PARI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
