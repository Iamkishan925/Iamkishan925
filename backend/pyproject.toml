[project]
name = "pari"
version = "0.1.0"
description = "Pari - MK's personal multilingual AI companion (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "qrcode>=7"]

[tool.setuptools.packages.find]
include = ["pari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
